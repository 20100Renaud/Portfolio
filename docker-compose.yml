services:
  postgres:
    image: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portfolio
    ports:
      - "5433:5432"
    volumes: 
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      postgres :
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/portfolio
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node src/server.js"

volumes:
  postgres_data:
